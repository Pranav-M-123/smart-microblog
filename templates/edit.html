<!DOCTYPE html>
<html>
<head>
    <title>Edit Post - AI Microblog</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; font-size: 16px;}
        button { padding: 10px 20px; background-color: #ffc107; color: black; border: none; cursor: pointer; border-radius: 5px;}
        a { margin-left: 10px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <h2>Edit Your Post</h2>
    <form method="POST">
        <textarea name="content" required>{{ post.text }}</textarea><br>
        <button type="submit">Save Changes</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
