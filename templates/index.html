<!DOCTYPE html>
<html>
<head>
    <title>AI Smart Microblog</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; font-size: 16px;}
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;}
        button:hover { background-color: #218838; }
        .post { margin-top: 30px; padding: 20px; border-radius: 8px; border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.1);}
    </style>
</head>
<body>
    <h1>AI Smart Microblog 🧠</h1>
    <p>Type a post and the AI will analyze your sentiment!</p>
    
    <form method="POST">
        <textarea name="content" placeholder="What's on your mind?" required></textarea><br>
        <button type="submit">Publish Post</button>
    </form>

    {% for post in posts %}
    <div class="post" style="background-color: {{ post.color }};">
        <h3>AI Analysis: {{ post.mood }}</h3>
        <p>{{ post.text }}</p>
    </div>
    {% endfor %}
    
</body>
</html>
