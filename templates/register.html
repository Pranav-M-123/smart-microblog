<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — Microblog</title>
    <style>
        :root { --bg: #f5f5f7; --card-bg: rgba(255, 255, 255, 0.75); --text: #1d1d1f; --accent: #0071e3; --border: rgba(0, 0, 0, 0.06); --blur: blur(24px); }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background-color: var(--bg); color: var(--text); max-width: 400px; margin: 100px auto; padding: 20px; -webkit-font-smoothing: antialiased; }
        .auth-card { background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,0.04); animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h2 { font-size: 24px; font-weight: 600; margin: 0 0 24px 0; text-align: center; }
        input { width: 100%; padding: 12px 16px; margin: 8px 0 20px 0; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; font-family: inherit; background: rgba(255, 255, 255, 0.5); outline: none; box-sizing: border-box; transition: border-color 0.2s; }
        input:focus { border-color: var(--accent); }
        .btn { background-color: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 980px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #0077ed; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 12px; font-size: 14px; }
        .alert-danger { background-color: rgba(255, 59, 48, 0.1); color: #d70015; }
        p { text-align: center; font-size: 14px; color: #86868b; margin-top: 24px; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Create Account</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label style="font-size: 13px; font-weight: 500; color: #86868b;">Username</label>
            <input type="text" name="username" required>
            <label style="font-size: 13px; font-weight: 500; color: #86868b;">Password</label>
            <input type="password" name="password" required>
            <button type="submit" class="btn">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>
</body>
</html>
